services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cix
      POSTGRES_USER: cixuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cixpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cixuser -d cix"]
      interval: 5s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=cix
      - DATABASE_USER=cixuser
      - DATABASE_PASSWORD=${DB_PASSWORD:-cixpassword}
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    volumes:
      - .:/app
      - /app/.venv
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
